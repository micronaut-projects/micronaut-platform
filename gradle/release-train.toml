# Modules released by the release train (.github/workflows/release-train.yml).
#
# Each table is keyed by the module's version entry in gradle/libs.versions.toml.
# By default the module lives in micronaut-projects/<key without "managed-"> and the
# train releases the <major>.<minor>.x branch of its managed version, so
# managed-micronaut-data = "5.2.2" tracks micronaut-projects/micronaut-data on 5.2.x.
#
# Optional overrides:
#   repo    = "micronaut-projects/micronaut-serialization"
#   branch  = "3.2.x"
#   exclude = "why the module releases on its own"
#
# An excluded module is never released by the train. It keeps releasing on its own, and the train
# picks up those releases into the platform catalog. Exclude modules whose releases would use a
# large share of the monthly Maven Central publishing limits below.
#
# The next version of a module always comes from the tracked branch's projectVersion
# (5.2.3-SNAPSHOT releases as 5.2.3). To release a minor, bump the branch to the next
# minor snapshot, or create the new branch and set `branch` here.

# Monthly Maven Central publishing limits of the io.micronaut namespace, from the Central Portal
# usage page (October 2026). The dry run shows each train as a share of them.
# See https://central.sonatype.org/publish/maven-central-publishing-limits/
[central-limits]
bytes = 8_500_000_000
files = 181_620
releases = 210

[modules.managed-micronaut-core]

[modules.managed-micronaut-data]

[modules.managed-micronaut-serialization]

# 190 artifacts, about 268 MB and 9,480 files per release (6.1.3): over half of the namespace's
# monthly file count across 14 releases in 90 days.
[modules.managed-micronaut-oraclecloud]
repo = "micronaut-projects/micronaut-oracle-cloud"
exclude = "each release publishes 190 artifacts (about 268 MB and 9,480 files), a large share of the monthly Maven Central limits"
