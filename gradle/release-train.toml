# Modules released by the release train (.github/workflows/release-train.yml).
#
# Every managed Micronaut module of this platform line is listed, keyed by its version entry in
# gradle/libs.versions.toml. `branch` is where the module's next release for this line comes from,
# normally the <major>.<minor>.x branch of its managed version: managed-micronaut-data = "5.2.2"
# releases from 5.2.x. Without `repo`, the module lives in micronaut-projects/<key without "managed-">.
#
# Optional settings:
#   repo    = "micronaut-projects/micronaut-discovery-client"
#   exclude = "why the module releases on its own"
#
# An excluded module is never released by the train. It keeps releasing on its own, and the train
# picks up those releases into the platform catalog. Exclude modules whose releases would use a
# large share of the monthly Maven Central publishing limits below.
#
# The next version of a module always comes from its branch's projectVersion (5.2.3-SNAPSHOT
# releases as 5.2.3). To release a minor, bump the branch to the next minor snapshot, or create
# the new branch and set `branch` here.

# Monthly Maven Central publishing limits of the io.micronaut namespace, from the Central Portal
# usage page (October 2026). The dry run shows each train as a share of them.
# See https://central.sonatype.org/publish/maven-central-publishing-limits/
[central-limits]
bytes = 8_500_000_000
files = 181_620
releases = 210

[modules.managed-micronaut-acme]
branch = "6.1.x"

